version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5

    # Wait a week after a release before proposing it (supply-chain mitigation).
    # Security updates bypass the cooldown by design.
    cooldown:
      default-days: 7

    groups:
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"
      npm-minor:
        applies-to: version-updates
        update-types:
          - "minor"
      npm-patch:
        applies-to: version-updates
        update-types:
          - "patch"
      # Security updates are not covered by the groups above; without this
      # each vulnerable dependency opens its own PR.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
